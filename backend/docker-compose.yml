# ================================================================
#  UniMente — Docker Compose (SQL Server 2022 + NestJS + Nginx SSL)
#  Instancia: AWS EC2 c7i-flex.large (2 vCPU / 4 GB RAM)
#
#  Primera vez en EC2:
#    cp .env.example .env        # editar con valores reales
#    ./nginx/gen-cert.sh         # generar certificado SSL (una sola vez)
#    docker compose up --build -d
#
#  Reinicios / actualizaciones:
#    docker compose up -d        # sin --build si no hubo cambios de código
#    docker compose up --build -d backend  # solo rebuild del backend
# ================================================================

services:

  # ─── SQL Server 2022 ─────────────────────────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU13-ubuntu-22.04
    container_name: unimente-sqlserver
    restart: unless-stopped

    environment:
      SA_PASSWORD:             "${DB_PASSWORD:-UniMente_DB_2026!}"
      ACCEPT_EULA:             "Y"
      MSSQL_PID:               "Developer"
      MSSQL_COLLATION:         "SQL_Latin1_General_CP1_CI_AS"
      MSSQL_TELEMETRY_ENABLED: "FALSE"
      MSSQL_MEMORY_LIMIT_MB:   "2400"

    # Puerto 1433 NO expuesto al exterior — solo red interna Docker.
    # Descomenta si necesitas acceso externo con SSMS (y abre el SG de AWS).
    # ports:
    #   - "1433:1433"

    volumes:
      - unimente_sqlserver_data:/var/opt/mssql

    networks:
      - unimente-internal

    mem_limit: 2800m
    mem_reservation: 2400m

    healthcheck:
      # Prueba mssql-tools18 (imagen 2022+) con fallback a legacy.
      test:
        - CMD-SHELL
        - >
          (/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "${DB_PASSWORD:-UniMente_DB_2026!}" -Q "SELECT 1" -C -b -o /dev/null 2>/dev/null)
          ||
          (/opt/mssql-tools/bin/sqlcmd -S localhost -U sa
          -P "${DB_PASSWORD:-UniMente_DB_2026!}" -Q "SELECT 1" -b -o /dev/null 2>/dev/null)
          || exit 1
      start_period: 90s   # SQL Server tarda ~30-60 s en iniciar
      interval:     15s
      timeout:      15s
      retries:      20

  # ─── NestJS Backend ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: unimente-backend
    restart: unless-stopped

    # Solo arranca cuando SQL Server pasa el healthcheck
    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_HOST:       db
      DB_PORT:       1433
      DB_USER:       sa
      DB_PASSWORD:   "${DB_PASSWORD:-UniMente_DB_2026!}"
      DB_NAME:       "${DB_NAME:-unimente}"
      DB_TRUST_CERT: "${DB_TRUST_CERT:-true}"

      JWT_SECRET:  "${JWT_SECRET:-CAMBIA_ESTE_SECRETO_EN_PRODUCCION_64CHARS}"
      JWT_EXPIRES: "${JWT_EXPIRES:-8h}"

      RESTORE_SECRET: "${RESTORE_SECRET:-UniMente_Restore_2026_SuperSecreta}"

      PORT:     3000
      NODE_ENV: "${NODE_ENV:-production}"

      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://aws.d1mrcwf1ifucba.amplifyapp.com,http://localhost:5173}"

      SEED_ADMIN_PASSWORD:        "${SEED_ADMIN_PASSWORD:-Admin1234!}"
      SEED_ADMIN_BRENDA_PASSWORD: "${SEED_ADMIN_BRENDA_PASSWORD:-Brenda1234!}"
      SEED_ADMIN_ABRIL_PASSWORD:  "${SEED_ADMIN_ABRIL_PASSWORD:-Abril1234!}"
      SEED_ADMIN_MAI_PASSWORD:    "${SEED_ADMIN_MAI_PASSWORD:-Mai1234!!}"
      SEED_DEFAULT_PASSWORD:      "${SEED_DEFAULT_PASSWORD:-Password123!}"

    # Puerto 3000 expuesto para desarrollo local.
    # En producción el tráfico llega via nginx (puerto 443).
    ports:
      - "${PORT:-3000}:3000"

    volumes:
      - unimente_backups:/app/Backup

    networks:
      - unimente-internal

    mem_limit: 768m
    mem_reservation: 512m

    healthcheck:
      # Verifica que el puerto 3000 acepte conexiones TCP.
      # Más fiable que hacer una petición HTTP (que puede fallar por timeout de Apollo).
      # nc (netcat) disponible en Alpine via busybox — verifica que el puerto TCP este abierto
      test: ["CMD-SHELL", "nc -z localhost 3000 || exit 1"]
      start_period: 180s  # El backend tarda ~2-3 min en EC2 (init BD + seed check)
      interval:     20s
      timeout:      10s
      retries:      10

  # ─── Nginx SSL Proxy ─────────────────────────────────────────────
  # Termina TLS para que Amplify (HTTPS) pueda conectar al backend.
  # Prerequisito: ejecutar ./nginx/gen-cert.sh una vez antes del primer arranque.
  nginx:
    image: nginx:1.27-alpine
    container_name: unimente-nginx
    restart: unless-stopped

    # Arranca en cuanto el proceso del backend inicia,
    # sin esperar el healthcheck (nginx reintentará hasta que el backend responda).
    depends_on:
      backend:
        condition: service_started

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Certificados Let's Encrypt (generados con certbot en el host)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot para renovacion automatica de Let's Encrypt
      - /var/www/certbot:/var/www/certbot:ro

    networks:
      - unimente-internal

# ─── Volumes ─────────────────────────────────────────────────────
volumes:
  unimente_sqlserver_data:
    driver: local
  unimente_backups:
    driver: local

# ─── Networks ────────────────────────────────────────────────────
networks:
  unimente-internal:
    name: unimente-network
    driver: bridge