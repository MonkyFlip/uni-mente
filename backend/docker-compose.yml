# ================================================================
#  UniMente — Docker Compose (SQL Server 2022 + NestJS)
#  Instancia: AWS EC2 c7i-flex.large (2 vCPU / 4 GB RAM)
#
#  Primera vez en EC2:
#    cp .env.example .env   # editar con valores reales
#    docker compose up --build -d
#
#  El servicio systemd "unimente" arranca esto automaticamente
#  en cada encendido de la EC2 (ver AWS.md).
#
#  OWASP mitigations:
#    A02: secretos desde .env
#    A05: red interna aislada, puerto 1433 NO expuesto publicamente
#    A06: imagenes con tag fijo
#    A08: healthcheck garantiza orden secuencial
# ================================================================

services:

  # ─── SQL Server 2022 ─────────────────────────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU13-ubuntu-22.04
    container_name: unimente-sqlserver
    restart: unless-stopped

    environment:
      SA_PASSWORD:             "${DB_PASSWORD:-UniMente_DB_2026!}"
      ACCEPT_EULA:             "Y"
      MSSQL_PID:               "Developer"
      MSSQL_COLLATION:         "SQL_Latin1_General_CP1_CI_AS"
      MSSQL_TELEMETRY_ENABLED: "FALSE"
      # c7i-flex.large (4 GB): SQL Server usa hasta 2.4 GB
      MSSQL_MEMORY_LIMIT_MB:   "2400"

    # SEGURIDAD: puerto 1433 NO expuesto al exterior.
    # Solo accesible desde el contenedor backend dentro de la red interna.
    # Si necesitas acceso con SSMS desde tu maquina, agrega temporalmente:
    #   ports:
    #     - "1433:1433"
    # Y abre el puerto 1433 en el Security Group de AWS.

    volumes:
      - unimente_sqlserver_data:/var/opt/mssql

    networks:
      - unimente-internal

    # c7i-flex.large: 2.8 GB para SQL Server
    mem_limit: 2800m
    mem_reservation: 2400m

    healthcheck:
      test:
        - CMD-SHELL
        - >
          (/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "${DB_PASSWORD:-UniMente_DB_2026!}" -Q "SELECT 1" -C -b -o /dev/null 2>/dev/null)
          ||
          (/opt/mssql-tools/bin/sqlcmd -S localhost -U sa
          -P "${DB_PASSWORD:-UniMente_DB_2026!}" -Q "SELECT 1" -b -o /dev/null 2>/dev/null)
          || exit 1
      start_period: 90s
      interval:     15s
      timeout:      15s
      retries:      20

  # ─── NestJS Backend ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: unimente-backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_HOST:       db
      DB_PORT:       1433
      DB_USER:       sa
      DB_PASSWORD:   "${DB_PASSWORD:-UniMente_DB_2026!}"
      DB_NAME:       "${DB_NAME:-unimente}"
      DB_TRUST_CERT: "${DB_TRUST_CERT:-true}"

      JWT_SECRET:  "${JWT_SECRET:-CAMBIA_ESTE_SECRETO_EN_PRODUCCION_64CHARS}"
      JWT_EXPIRES: "${JWT_EXPIRES:-8h}"

      RESTORE_SECRET: "${RESTORE_SECRET:-UniMente_Restore_2026_SuperSecreta}"

      PORT:     3000
      NODE_ENV: "${NODE_ENV:-production}"

      # Frontend en Amplify + desarrollo local
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://aws.d1mrcwf1ifucba.amplifyapp.com,http://localhost:5173,http://localhost:3000}"

      SEED_ADMIN_PASSWORD:        "${SEED_ADMIN_PASSWORD:-Admin1234!}"
      SEED_ADMIN_BRENDA_PASSWORD: "${SEED_ADMIN_BRENDA_PASSWORD:-Brenda123!}"
      SEED_ADMIN_ABRIL_PASSWORD:  "${SEED_ADMIN_ABRIL_PASSWORD:-Abril123!}"
      SEED_ADMIN_MAI_PASSWORD:    "${SEED_ADMIN_MAI_PASSWORD:-Mai123!}"
      SEED_DEFAULT_PASSWORD:      "${SEED_DEFAULT_PASSWORD:-Password123!}"

    ports:
      # Puerto 3000 accesible desde internet (frontend Amplify → EC2)
      - "${PORT:-3000}:3000"

    volumes:
      - unimente_backups:/app/Backup

    networks:
      - unimente-internal

    # c7i-flex.large: NestJS con margen holgado
    mem_limit: 768m
    mem_reservation: 512m

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/graphql || exit 1"]
      start_period: 60s
      interval:     30s
      timeout:      10s
      retries:      5

# ─── Volumes ─────────────────────────────────────────────────────
volumes:
  unimente_sqlserver_data:
    driver: local
  unimente_backups:
    driver: local

# ─── Networks ────────────────────────────────────────────────────
networks:
  unimente-internal:
    name: unimente-network
    driver: bridge