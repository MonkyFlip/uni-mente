version: "3.9"

# ================================================================
#  UniMente — Docker Compose
#  SQL Server 2022 + NestJS Backend
#
#  ✔ MSSQL aislado en red interna
#  ✔ Backend expuesto solo en puerto 3000
#  ✔ Persistencia de datos y backups
#  ✔ Sin exposición innecesaria de puertos
# ================================================================

services:

  # ─── SQL Server 2022 ─────────────────────────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU13-ubuntu-22.04
    container_name: unimente-sqlserver
    restart: unless-stopped
    environment:
      SA_PASSWORD: "${DB_PASSWORD}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_COLLATION: "SQL_Latin1_General_CP1_CI_AS"
      MSSQL_TELEMETRY_ENABLED: "FALSE"
    volumes:
      - unimente_sqlserver_data:/var/opt/mssql
    networks:
      - unimente-internal
    healthcheck:
      test:
        - CMD-SHELL
        - |
          /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "${DB_PASSWORD}" \
            -Q "SELECT 1" -C -b -o /dev/null 2>&1 || exit 1
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  # ─── NestJS Backend ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: unimente-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 1433
      DB_USER: sa
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME}"
      DB_TRUST_CERT: "true"

      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRES: "8h"

      RESTORE_SECRET: "${RESTORE_SECRET}"

      PORT: 3000
      NODE_ENV: production

      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"

      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD}"
      SEED_DEFAULT_PASSWORD: "${SEED_DEFAULT_PASSWORD}"

    ports:
      - "3000:3000"
    volumes:
      - unimente_backups:/app/Backup
    networks:
      - unimente-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/graphql || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

# ─── Volúmenes persistentes ──────────────────────────────────────
volumes:
  unimente_sqlserver_data:
  unimente_backups:

# ─── Red interna aislada ─────────────────────────────────────────
networks:
  unimente-internal:
    driver: bridge
