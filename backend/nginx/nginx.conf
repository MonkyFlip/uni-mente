events {
  worker_connections 1024;
}

http {

  # Origenes CORS permitidos
  map $http_origin $cors_origin {
      "https://aws.d1mrcwf1ifucba.amplifyapp.com" "https://aws.d1mrcwf1ifucba.amplifyapp.com";
      "https://unimente.duckdns.org"               "https://unimente.duckdns.org";
      "http://localhost:5173"                      "http://localhost:5173";
      default                                      "";
  }

  # ── HTTP → HTTPS ────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;

    # Ruta de renovacion de Let's Encrypt (certbot webroot)
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS → NestJS ──────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name _;

    # Certificado Let's Encrypt (reemplaza el autofirmado)
    # Ruta dentro del contenedor (montada desde /etc/letsencrypt en el host)
    ssl_certificate     /etc/letsencrypt/live/unimente.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unimente.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ── GraphQL ──────────────────────────────────────────────────
    location /graphql {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, apollo-require-preflight, x-apollo-operation-name" always;
        add_header Access-Control-Max-Age           86400 always;
        return 204;
      }

      proxy_pass         http://backend:3000/graphql;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;

      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Vary;

      add_header Access-Control-Allow-Origin      $cors_origin always;
      add_header Access-Control-Allow-Credentials true always;
    }

    # ── REST (emergency-backups, emergency-restore, backup-download)
    location /api/ {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Restore-Secret" always;
        return 204;
      }

      proxy_pass         http://backend:3000/api/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;

      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Credentials;

      add_header Access-Control-Allow-Origin      $cors_origin always;
      add_header Access-Control-Allow-Credentials true always;
    }
  }
}