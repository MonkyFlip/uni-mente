# ================================================================
#  UniMente — Nginx SSL Proxy
#  Termina TLS para permitir conexion HTTPS desde Amplify al backend.
#  Certificado: autofirmado generado con nginx/gen-cert.sh
# ================================================================

events {
  worker_connections 1024;
}

http {
  # Logging
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # Timeouts generosos para queries GraphQL lentas
  proxy_connect_timeout 60s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;

  # ── HTTP → HTTPS redirect ─────────────────────────────────────
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # ── HTTPS → NestJS backend ────────────────────────────────────
  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # GraphQL API (POST)
    location /graphql {
      proxy_pass         http://backend:3000/graphql;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;

      # CORS para Amplify
      add_header Access-Control-Allow-Origin  "https://aws.d1mrcwf1ifucba.amplifyapp.com" always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

      # Preflight OPTIONS
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  "https://aws.d1mrcwf1ifucba.amplifyapp.com";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        add_header Content-Length 0;
        return 204;
      }
    }

    # REST endpoints (emergency-backups, emergency-restore)
    location /api/ {
      proxy_pass         http://backend:3000/api/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
    }

    # Healthcheck interno
    location /health {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}